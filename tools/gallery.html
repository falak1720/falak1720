<!doctype html>
<html><head><meta charset="utf-8"><title>SVG gallery</title>
<style>
body{margin:0;padding:16px;font:13px system-ui;background:#fff;color:#222}
body.dark{background:#0d1117;color:#ddd}
img{display:block;max-width:100%;margin:6px 0 22px;border:1px dashed #8884}
.row{display:flex;gap:8px}.row img{width:32%}
</style></head>
<body>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'light';
if (mode === 'dark') document.body.className = 'dark';
const one = ['header','typing','console','pipeline','toolkit','stats','stroop','footer'];
const cards = ['card-social','card-nasa','card-tones'];
const only = new URLSearchParams(location.search).get('only');
const list = only ? only.split(',') : [...one.slice(0,3), 'CARDS', ...one.slice(3)];
for (const n of list) {
  if (n === 'CARDS') {
    const r = document.createElement('div'); r.className = 'row';
    for (const c of cards) { const i = new Image(); i.src = `../assets/${c}-${mode}.svg`; r.appendChild(i); }
    document.body.appendChild(r); continue;
  }
  const i = new Image(); i.src = `../assets/${n}-${mode}.svg?${Date.now()}`; document.body.appendChild(i);
}
</script>
</body></html>
